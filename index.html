<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Kalkulator Sederhana</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --key: #1f2937;
      --key-hover: #374151;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --danger: #7f1d1d;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, .2), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 24px;
      background: rgba(17, 24, 39, .94);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .display {
      width: 100%;
      min-height: 96px;
      margin-bottom: 18px;
      padding: 18px;
      display: flex;
      align-items: end;
      justify-content: end;
      overflow: hidden;
      border-radius: 16px;
      background: #020617;
      font-size: clamp(2rem, 10vw, 3rem);
      font-weight: 700;
      line-height: 1;
      text-align: right;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 62px;
      border: 0;
      border-radius: 15px;
      background: var(--key);
      color: var(--text);
      font: inherit;
      font-size: 1.2rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
    }

    button:hover { background: var(--key-hover); }
    button:active { transform: scale(.95); }
    button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }

    .operator { background: #1e3a8a; }
    .operator:hover, .equals:hover { background: var(--accent-hover); }
    .equals { background: var(--accent); }
    .clear { background: var(--danger); }
    .zero { grid-column: span 2; }

    .hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Kalkulator sederhana">
    <h1>Kalkulator</h1>
    <output id="display" class="display" aria-live="polite">0</output>

    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="sign">±</button>
      <button data-action="percent">%</button>
      <button class="operator" data-operator="/">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="*">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="-">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button class="zero" data-number="0">0</button>
      <button data-number=".">,</button>
      <button class="equals" data-action="equals">=</button>
    </div>

    <p class="hint">Mendukung keyboard: angka, +, −, ×, ÷, Enter, dan Esc</p>
  </main>

  <script>
    (() => {
      const display = document.querySelector("#display");
      let current = "0";
      let previous = null;
      let operator = null;
      let waitingForOperand = false;

      const format = (value) => {
        if (!Number.isFinite(value)) return "Error";
        return Number(value.toPrecision(12)).toString();
      };

      const render = () => {
        display.textContent = current.replace(".", ",");
      };

      const inputNumber = (value) => {
        if (current === "Error" || waitingForOperand) {
          current = value === "." ? "0." : value;
          waitingForOperand = false;
        } else if (value === ".") {
          if (!current.includes(".")) current += ".";
        } else {
          current = current === "0" ? value : current + value;
        }

        if (current.replace("-", "").replace(".", "").length > 12) {
          current = current.slice(0, -1);
        }
        render();
      };

      const calculate = (left, right, op) => {
        switch (op) {
          case "+": return left + right;
          case "-": return left - right;
          case "*": return left * right;
          case "/": return right === 0 ? NaN : left / right;
          default: return right;
        }
      };

      const chooseOperator = (nextOperator) => {
        const value = Number(current);
        if (!Number.isFinite(value)) return clear();

        if (operator && !waitingForOperand) {
          const result = calculate(previous, value, operator);
          current = format(result);
          previous = Number(current);
          render();
          if (current === "Error") {
            operator = null;
            previous = null;
            return;
          }
        } else {
          previous = value;
        }

        operator = nextOperator;
        waitingForOperand = true;
      };

      const equals = () => {
        if (operator === null || waitingForOperand) return;
        const result = calculate(previous, Number(current), operator);
        current = format(result);
        previous = null;
        operator = null;
        waitingForOperand = false;
        render();
      };

      const clear = () => {
        current = "0";
        previous = null;
        operator = null;
        waitingForOperand = false;
        render();
      };

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.number) inputNumber(button.dataset.number);
        if (button.dataset.operator) chooseOperator(button.dataset.operator);
        if (button.dataset.action === "equals") equals();
        if (button.dataset.action === "clear") clear();
        if (button.dataset.action === "sign" && current !== "0" && current !== "Error") {
          current = String(Number(current) * -1);
          render();
        }
        if (button.dataset.action === "percent" && current !== "Error") {
          current = format(Number(current) / 100);
          render();
        }
      });

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        if (/^[0-9]$/.test(key)) inputNumber(key);
        else if (key === "." || key === ",") inputNumber(".");
        else if (["+", "-", "*", "/"].includes(key)) chooseOperator(key);
        else if (key === "Enter" || key === "=") equals();
        else if (key === "Escape") clear();
        else if (key === "Backspace" && !waitingForOperand) {
          current = current.length > 1 ? current.slice(0, -1) : "0";
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
